<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>동파법 백테스터 SLOT8 FIX</title>
<style>
html,body{margin:0;min-height:100%;background:#eef6fb;color:#243749;font:15px system-ui,-apple-system,"Noto Sans KR",sans-serif}
#loading{max-width:680px;margin:32px auto;padding:18px;background:#fff;border:1px solid #d7e4ee;border-radius:14px;line-height:1.6}
.err{color:#b91c1c;font-weight:700;white-space:pre-wrap}
</style>
</head>
<body>
<div id="loading">
  <b>동파법 백테스터를 불러오는 중입니다.</b><br>
  8분할 완전점유 시 당일 매도 슬롯 재사용 금지 수정본
  <div id="status"></div>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const url="https://raw.githubusercontent.com/wonij4004/soxl-backtester/7c9b191c91aac0128c1bb8b9ceae7df9335026de/index.html";
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('원본 로드 실패 HTTP '+res.status);

    let outer=await res.text();
    const needle="  const text=new TextDecoder().decode(plain);";
    if(!outer.includes(needle))
      throw new Error('수정 위치를 찾지 못했습니다.');

    const replacement="let text=new TextDecoder().decode(plain);\n\n  /* DONGPA_SLOT8_PREEXEC_FIX_20261013\n     \uc7a5 \uc2dc\uc791 \uc2dc CORE\uac00 \ucd5c\ub300 \ubd84\ud560\ub85c \uaf49 \ucc28 \uc788\uc73c\uba74,\n     \ub2f9\uc77c \ub9e4\ub3c4/\ub9cc\uae30 \uc608\uc815 lot\ub97c \ubbf8\ub9ac \uc2ac\ub86f\uc5d0\uc11c \ube7c\uc9c0 \uc54a\ub294\ub2e4.\n     \ub9e4\ub3c4\ub85c \ube48 \uc2ac\ub86f\uc740 \ub2e4\uc74c \uac70\ub798\uc77c\ubd80\ud130 \uc0ac\uc6a9\ud55c\ub2e4. */\n  {\n    const dpFixEngineSource=(s)=>{\n      s=s.split('knownSlots=preCount-expiryCount').join('knownSlots=preCount');\n\n      // 8\ubd84\ud560 \uc2ac\ub86f \uc218\uc815\uc73c\ub85c \ubc14\ub00c\ub294 2020-01-02~2026-09-11 \uc778\uc99d\uc9c0\ubb38\n      const reps=[\n        ['1785054.67','1725254.76'],\n        ['1974496.47','1908682.03'],\n        ['2325425.35','2248190.07'],\n        ['2524345.21','2441461.92'],\n        ['117.0221073886386','115.91976926675672'],\n        ['120.3182665','119.20488170878785'],\n        ['125.77100591308206','124.63419334491581'],\n        ['128.5574749','127.41998130001035'],\n        ['-41.729935846334186','-41.806940104634'],\n        ['-41.7372410','-41.77174615157767'],\n        ['-41.55096938444266','-41.699491075877084'],\n        ['-40.9980374','-41.58847547028767'],\n        ['d.guardBlockedCount===3','d.guardBlockedCount===2']\n      ];\n      for(const [a,b] of reps)s=s.split(a).join(b);\n      return s;\n    };\n\n    // index.html / r15-r51-v041.html : \uc5d4\uc9c4\uc774 \ubcf5\ud638\ud654 \ubcf8\ubb38\uc5d0 \uc9c1\uc811 \uc874\uc7ac\n    if(text.includes('knownSlots=preCount-expiryCount')){\n      text=dpFixEngineSource(text);\n    } else {\n      // r15-sleeve-v041.html : \uc2e4\uc81c \uc5d4\uc9c4\uc774 ENGINE_B64 \uc548\uc5d0 \ub0b4\uc7a5\n      const m=text.match(/const ENGINE_B64\\s*=\\s*(['\"])([A-Za-z0-9+/=]+)\\1/);\n      if(!m) throw new Error('SLOT8 FIX: engine source not found');\n\n      const engineBytes=Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0));\n      let engineText=new TextDecoder().decode(engineBytes);\n      if(!engineText.includes('knownSlots=preCount-expiryCount'))\n        throw new Error('SLOT8 FIX: target rule not found in embedded engine');\n\n      engineText=dpFixEngineSource(engineText);\n\n      const enc=new TextEncoder().encode(engineText);\n      let bin='';\n      for(let i=0;i<enc.length;i+=0x8000)\n        bin+=String.fromCharCode(...enc.subarray(i,i+0x8000));\n      const engineB64=btoa(bin);\n\n      text=text.replace(m[0],m[0].replace(m[2],engineB64));\n    }\n\n    // \ud328\uce58\uac00 \uc2e4\uc81c \uc5d4\uc9c4\uc5d0 \uc801\uc6a9\ub418\uc5c8\ub294\uc9c0 \uc2e4\ud589 \uc804 \ud655\uc778\n    if(text.includes('knownSlots=preCount-expiryCount'))\n      throw new Error('SLOT8 FIX: old rule still remains');\n  }\n/* DONGPA_SOURCE_REFRESH_FIX_20261020: data adapter and status only. */\nfunction dpPatchSourceRefresh(source) {\n  function replaceOnce(a,b) {\n    if(source.split(a).length!==2) throw new Error('SOURCE FIX: expected unique patch target: '+a.slice(0,70));\n    source=source.replace(a,()=>b);\n  }\n  replaceOnce('function adaptDBALL(data,cutoff){', `function adaptDBALL(data,cutoff){\n // Only repair an invalid primary price using this same sheet's dated N/O close.\n // Never replace a valid primary price, interpolate, or skip a missing session.\n const secondary=new Map(), recovered=[];\n const sh=data.findIndex(r=>String(r[13]).trim()==='Date'&&String(r[14]).trim()==='Close');\n if(sh>=0)for(const r of data.slice(sh+1)){\n   const match=String(r[13]??'').match(/^(\\\\d{4})[.\\\\/-]\\\\s*(\\\\d{1,2})[.\\\\/-]\\\\s*(\\\\d{1,2})(?:[.\\\\s]|$)/);\n   const d=match?parseDate(match[1]+'-'+match[2]+'-'+match[3]):parseDate(r[13]);\n   const c=numberValue(r[14]);if(!d||!Number.isFinite(c)||c<=0)continue;\n   const key=dateKeyLocal(d);if(key>cutoff)continue;\n   if(secondary.has(key)&&secondary.get(key)!==c)throw new Error(key+' \ubcf4\uc870 \uc885\uac00 \uc911\ubcf5/\ucda9\ub3cc');\n   secondary.set(key,c);\n }\n const priceHeader=data.findIndex(r=>String(r[0]).trim()==='\uc57c\uc639DB'&&String(r[1]).trim()==='SOXL');\n data=data.map((r,i)=>{\n   if(i<=priceHeader)return r;\n   const d=parseDate(r[0]), c=numberValue(r[1]);\n   if(!d||dateKeyLocal(d)>cutoff||(Number.isFinite(c)&&c>0))return r;\n   const key=dateKeyLocal(d);if(!secondary.has(key))return r;\n   const copy=r.slice();copy[1]=secondary.get(key);recovered.push({date:key,close:copy[1],source:'\ub3d9\uc77c \uc6d0\uc7a5 N/O'});return copy;\n });`);\n  replaceOnce('return {prices,weeks,last,first,corrections};','return {prices,weeks,last,first,corrections,recovered};');\n  replaceOnce(\"const table=response.table,ids=['A','B','E','F','H'],types=['date','number','date','date','string'];\", \"const table=response.table,ids=['A','B','E','F','H','N','O'],types=['date','number','date','date','string','datetime','number'];\");\n  replaceOnce('table.cols.length!==5','table.cols.length!==7');\n  replaceOnce(\"c.type!==types[i]\", \"!(c.type===types[i]||(i===5&&c.type==='date'))\");\n  replaceOnce(\"if(types[col]==='date'){\", \"if(types[col]==='date'||types[col]==='datetime'){\");\n  replaceOnce(\"/^Date\\\\((\\\\d{4}),(\\\\d{1,2}),(\\\\d{1,2})\\\\)$/\", \"/^Date\\\\((\\\\d{4}),(\\\\d{1,2}),(\\\\d{1,2})(?:,\\\\d{1,2},\\\\d{1,2},\\\\d{1,2})?\\\\)$/\");\n  replaceOnce(\"const rows=[['\uc57c\uc639DB','SOXL','','','\uc2dc\uc791','\uc885\ub8cc','','\ubaa8\ub4dc']];\\n for(const row of table.rows)\",\"const rows=[['\uc57c\uc639DB','SOXL','','','\uc2dc\uc791','\uc885\ub8cc','','\ubaa8\ub4dc','','','','','','Date','Close']];\\n for(const row of table.rows)\");\n  replaceOnce('row.c.length>5','row.c.length>7');\n  replaceOnce(\"rows.push([v[0],v[1],'','',v[2],v[3],'',v[4]]);\", \"rows.push([v[0],v[1],'','',v[2],v[3],'',v[4],'','','','','',v[5],v[6]]);\");\n  replaceOnce(\"range:'A4:H'\", \"range:'A4:O'\");\n  replaceOnce(\"tq:'select A,B,E,F,H'\", \"tq:'select A,B,E,F,H,N,O'\");\n  replaceOnce(\"const response=await fetch(url,{signal:controller.signal});\", \"const response=await fetch(url,{signal:controller.signal,cache:'no-store'});\");\n  replaceOnce(\"function renderFullConnectionStatus(){\", `function renderFullConnectionStatus(){\n const audit=document.getElementById('fullAuditNote');\n let coverage=document.getElementById('dpCoverage');\n if(!coverage&&audit){coverage=document.createElement('div');coverage.id='dpCoverage';coverage.setAttribute('role','status');coverage.style.cssText='padding:10px 12px;margin:8px 0;border:1px solid #d97706;border-radius:8px;background:#fffbeb;color:#78350f;font-size:13px;white-space:pre-line';audit.before(coverage);}\n if(coverage){\n  const requested=document.getElementById('endDate').value;\n  const actual=fullLastResult?.history?.length?dateKeyLocal(fullLastResult.history.at(-1).date):'\ubbf8\uacc4\uc0b0';\n  coverage.textContent='\uc694\uccad \uc885\ub8cc\uc77c '+requested+' \u00b7 \uc2e4\uc81c \uacc4\uc0b0 \uc885\ub8cc\uc77c '+actual+' \u00b7 \uc6d0\uc7a5 \ub9c8\uc9c0\ub9c9 \ub0a0\uc9dc '+(fullDb?.last||'\uc5c6\uc74c')+\n   (fullRefreshFailure?'\\\\n\ucd5c\uc2e0 \uc790\ub8cc \ubc18\uc601 \uc2e4\ud328: '+fullRefreshFailure+' \u2014 \uc544\ub798 \uacb0\uacfc\ub294 \ud655\ubcf4\ub41c \uc790\ub8cc\uae4c\uc9c0\ub9cc \uacc4\uc0b0\ud588\uc2b5\ub2c8\ub2e4.':fullPending?'\\\\n\ucd5c\uc2e0 \uc6d0\uc7a5 \ud655\uc778 \uc911':actual!==requested?'\\\\n\uc694\uccad\uc77c\uacfc \uc2e4\uc81c \uacc4\uc0b0\uc77c\uc774 \ub2e4\ub985\ub2c8\ub2e4. \ubbf8\ud655\uc815 \uac70\ub798\uc77c\u00b7\ud734\uc7a5\uc77c \ub610\ub294 \uc790\ub8cc \uc9c0\uc5f0 \uc5ec\ubd80\ub97c \ud655\uc778\ud558\uc138\uc694.':'')+\n   (fullDb?.recovered?.length?'\\\\n\ub3d9\uc77c \uc6d0\uc7a5 \ubcf4\uc870 \uc885\uac00\ub85c \ubcf5\uad6c: '+fullDb.recovered.map(x=>x.date+' $'+x.close).join(', '):'');\n }\n`);\n  replaceOnce(\"badge.textContent=have?'\ud83d\udfe1 \ucd5c\uc2e0 \uc5f0\uacb0 \uc2e4\ud328 \u00b7 \uc800\uc7a5\uc790\ub8cc \uc0ac\uc6a9 \uac00\ub2a5':'\ud83d\udd34 \uc6d0\uc7a5 \uc5f0\uacb0 \uc2e4\ud328';\", \"badge.textContent=have?'\ud83d\udfe0 \ucd5c\uc2e0 \ubc18\uc601 \uc2e4\ud328 \u00b7 '+fullDb.last+'\uae4c\uc9c0\ub9cc \uacc4\uc0b0':'\ud83d\udd34 \uc6d0\uc7a5 \uc5f0\uacb0 \uc2e4\ud328';\");\n  return source;\n}\ntext=dpPatchSourceRefresh(text);\n";
    outer=outer.replace(needle,()=>replacement);

    if(!outer.includes('DONGPA_SLOT8_PREEXEC_FIX_20261013'))
      throw new Error('SLOT8 패치 삽입 실패');

    document.open();
    document.write(outer);
    document.close();
  }catch(e){
    status.className='err';
    status.textContent='실행 실패\n'+(e&&e.message?e.message:String(e));
  }
})();
</script>
</body>
</html>
