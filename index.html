  if(current.split(sourceMarker).length!==2)throw new Error('J 화면 삽입 위치 불일치');
  const jCode="/* DONGPA_J_BOOST_STABLE_FINAL_V1_1_REF_ORDER_GUARD_MIN1 */\nconst dpJOne=(s,a,b,label)=>{\n  if(s.split(a).length!==2) throw new Error('J 패치 위치 불일치: '+label);\n  return s.replace(a,()=>b);\n};\nconst dpJAll=(s,a,b,label)=>{\n  if(!s.includes(a)) throw new Error('J 패치 위치 없음: '+label);\n  return s.split(a).join(b);\n};\nconst dpJPatchProgram=(program)=>{\n  let s=program;\n\n  /* J-only execution flag. I and all earlier variants keep their existing path. */\n  s=dpJOne(\n    s,\n    \"const {first,last,firstDate,initial,fee,sec,flowMap,withdrawalSettings,slotPolicy='separate',weightPolicy='origin'}=settings;\",\n    \"const {first,last,firstDate,initial,fee,sec,flowMap,withdrawalSettings,slotPolicy='separate',weightPolicy='origin',refOrderGuardMin1=false}=settings;\",\n    'handover candidate flag'\n  );\n  s=dpJOne(\n    s,\n    \"else if(loc>0&&capacityCount<slots){q=Math.max(0,Math.floor(budget/loc));if(commitment(q,loc,places)>preCash)q=Math.max(0,Math.floor(preCash/(loc*(1+fee))));}\\n            const planned=q,skip=planned>0&&dv.skip&&!genesis;if(skip)q=0;\",\n    \"else if(loc>0&&capacityCount<slots){q=Math.max(0,Math.floor(budget/loc));if(commitment(q,loc,places)>preCash)q=Math.max(0,Math.floor(preCash/(loc*(1+fee))));}\\n            const armGuardActive=Boolean(timeline.armByIndex?.[i]);\\n            const refOrderQty=Number(cref?.core_order_qty||0);\\n            let refOrderGuardApplied=false;\\n            if(refOrderGuardMin1&&active==='H'&&hCore===0&&capacityCount<slots&&q===0&&budget>0&&loc>0&&budget<loc&&commitment(1,loc,places)<=preCash+1e-8&&refOrderQty>=1&&!armGuardActive){q=1;refOrderGuardApplied=true;}\\n            const planned=q,skip=planned>0&&dv.skip&&!genesis;if(skip)q=0;\",\n    'REF-ORDER MIN1 before FINAL SKIP'\n  );\n  s=dpJOne(\n    s,\n    \"const settings={first,last,firstDate,initial,fee,sec,flowMap,withdrawalSettings,slotPolicy,weightPolicy};\",\n    \"const settings={first,last,firstDate,initial,fee,sec,flowMap,withdrawalSettings,slotPolicy,weightPolicy,refOrderGuardMin1:Boolean(options.refOrderGuardMin1)};\",\n    'candidate flag propagation'\n  );\n  s=dpJOne(\n    s,\n    \"const timeline={stateByIndex:sch.states.map(x=>x.mode),gEntryByIndex:sch.states.map((x,i)=>x.mode==='G'?i-x.boostDay+1:null),transitions:sch.events};\",\n    \"const timeline={stateByIndex:sch.states.map(x=>x.mode),gEntryByIndex:sch.states.map((x,i)=>x.mode==='G'?i-x.boostDay+1:null),transitions:sch.events,armByIndex:sch.states.map((_,i)=>i>0&&Boolean(sch.states[i-1]?.arm))};\",\n    'previous-close ARM guard'\n  );\n  s=dpJOne(\n    s,\n    \"buyOrigin:active,buySleeveFamily:sleeve?.family||'',core_order_qty:q,\",\n    \"buyOrigin:active,buySleeveFamily:sleeve?.family||'',refOrderGuardApplied,refOrderQty,armGuardActive,core_order_qty:q,\",\n    'candidate audit fields'\n  );\n\n  /* Add J beside I without changing I calculations. */\n  s=dpJOne(\n    s,\n    \"return variant === 'F' || variant === 'G' || variant === 'H' || variant === 'I';\",\n    \"return variant === 'F' || variant === 'G' || variant === 'H' || variant === 'I' || variant === 'J';\",\n    'J supported variant'\n  );\n  s=dpJAll(\n    s,\n    \"(variant === 'G' || variant === 'H' || variant === 'I')\",\n    \"(variant === 'G' || variant === 'H' || variant === 'I' || variant === 'J')\",\n    'J fixed setting visibility'\n  );\n  s=dpJOne(\n    s,\n    \"byId('boostIPanel').hidden = variant !== 'I';\",\n    \"byId('boostIPanel').hidden = variant !== 'I' && variant !== 'J';\",\n    'J boost panel visibility'\n  );\n  s=dpJOne(\n    s,\n    \": variant === 'I' ? '6A 기본 · A1/A2/B CONFIRM 다음 거래일부터 7A BOOST 60거래일 · 기존 LOT 출처 유지 · H/G shadow와 Reference는 2020-01-02부터 연속 계산'\",\n    \": variant === 'J' ? 'BOOST 안정형 FINAL V1.1 · V1.0 전체 규칙 유지 + 6A 첫 H CORE 0주 시 REF-ORDER GUARD MIN1 · 전일 ARM 없음 · 기존 FINAL SKIP 유지'\\n            : variant === 'I' ? '6A 기본 · A1/A2/B CONFIRM 다음 거래일부터 7A BOOST 60거래일 · 기존 LOT 출처 유지 · H/G shadow와 Reference는 2020-01-02부터 연속 계산'\",\n    'J rule note'\n  );\n  s=dpJOne(\n    s,\n    \"variant === 'I' ? ' · 6A 기본 + 7A 60거래일 BOOST · A1/A2/B · 본계좌만' : variant === 'H' ?\",\n    \"variant === 'J' ? ' · V1.0 + FIRST-H REF-ORDER GUARD MIN1 · 본계좌만' : variant === 'I' ? ' · 6A 기본 + 7A 60거래일 BOOST · A1/A2/B · 본계좌만' : variant === 'H' ?\",\n    'J module note'\n  );\n  s=dpJOne(\n    s,\n    \"if (params.variant !== 'G' && params.variant !== 'H' && params.variant !== 'I') throw error;\",\n    \"if (params.variant !== 'G' && params.variant !== 'H' && params.variant !== 'I' && params.variant !== 'J') throw error;\",\n    'J comparison tolerance'\n  );\n  s=dpJOne(\n    s,\n    \"const I = runDongpaBoostFinal(data, opts);\\n        return { ok: true, last: data.last, notice: data.notice, F, G, H, I, external };\",\n    \"const I = runDongpaBoostFinal(data, opts);\\n        const J = runDongpaBoostFinal(data, {...opts,refOrderGuardMin1:true});\\n        return { ok: true, last: data.last, notice: data.notice, F, G, H, I, J, external };\",\n    'J range run'\n  );\n  s=dpJOne(\n    s,\n    \"const i = normalizeDongpaFinalResult(runDongpaBoostFinal(data, dongpaFinalComparisonOptions(params, start, end)), comparisonParams, 'I');\",\n    \"const i = normalizeDongpaFinalResult(runDongpaBoostFinal(data, dongpaFinalComparisonOptions(params, start, end)), comparisonParams, 'I');\\n        const j = normalizeDongpaFinalResult(runDongpaBoostFinal(data, {...dongpaFinalComparisonOptions(params, start, end),refOrderGuardMin1:true}), comparisonParams, 'J');\",\n    'J companion recalculation'\n  );\n  s=dpJOne(\n    s,\n    \"const i = normalizeDongpaFinalResult(runDongpaBoostFinal(data, opts), params, 'I');\",\n    \"const i = normalizeDongpaFinalResult(runDongpaBoostFinal(data, opts), params, 'I');\\n        const j = normalizeDongpaFinalResult(runDongpaBoostFinal(data, {...opts,refOrderGuardMin1:true}), params, 'J');\",\n    'J selected recalculation'\n  );\n  s=dpJAll(\n    s,\n    \"renderDongpaICard(i, h, params);\",\n    \"renderDongpaICard(i, h, params);\\n        renderDongpaJCard(j, i, params);\",\n    'J comparison card render'\n  );\n  s=dpJOne(\n    s,\n    \"renderDongpaICard(null, null, params);\",\n    \"renderDongpaICard(null, null, params);\\n        renderDongpaJCard(null, null, params);\",\n    'J clear failed comparison'\n  );\n  s=dpJOne(\n    s,\n    \"const result = variant === 'F' ? f : variant === 'G' ? g : variant === 'I' ? i : h;\",\n    \"const result = variant === 'F' ? f : variant === 'G' ? g : variant === 'I' ? i : variant === 'J' ? j : h;\",\n    'J selected result'\n  );\n  s=dpJOne(\n    s,\n    \"const preCount = variant === 'I' ? day.hCoreStart + day.gCoreStart : day.startOfDayPort ?? day.pre_core_lots;\",\n    \"const preCount = (variant === 'I' || variant === 'J') ? day.hCoreStart + day.gCoreStart : day.startOfDayPort ?? day.pre_core_lots;\",\n    'J trade audit pre-count'\n  );\n  s=dpJOne(\n    s,\n    \"sameDayExitSlotBlocked: preCount >= (variant === 'I' ? (day.boostMode === 'H' ? 6 : 7) : slots) && exits.has(day.date)\",\n    \"sameDayExitSlotBlocked: preCount >= ((variant === 'I' || variant === 'J') ? (day.boostMode === 'H' ? 6 : 7) : slots) && exits.has(day.date)\",\n    'J trade audit slots'\n  );\n  s=dpJOne(\n    s,\n    \"if (result.stats.variant === 'I') fields.splice(1,0,'origin');\",\n    \"if (result.stats.variant === 'I' || result.stats.variant === 'J') fields.splice(1,0,'origin');\",\n    'J lot export origin'\n  );\n  s=dpJOne(\n    s,\n    \"for(const v of 'ABCDEFGHI'){const el=byId('cmp'+v+'Final');if(el)el.closest('.rounded-lg').toggleAttribute('data-comparison-selected',v===params.variant[0]);}\",\n    \"for(const v of 'ABCDEFGHIJ'){const el=byId('cmp'+v+'Final');if(el)el.closest('.rounded-lg').toggleAttribute('data-comparison-selected',v===params.variant[0]);}\",\n    'I/J selection highlight'\n  );\n  s=dpJOne(\n    s,\n    \"const el=document.getElementById('boostIPanel');el.hidden=params.variant!=='I';if(params.variant!=='I')return;\",\n    \"const el=document.getElementById('boostIPanel');el.hidden=params.variant!=='I'&&params.variant!=='J';if(params.variant!=='I'&&params.variant!=='J')return;const heading=document.getElementById('boostIHeading');if(heading)heading.innerHTML=params.variant==='J'?'J · BOOST 안정형 FINAL <span>V1.1</span>':'I · BOOST 안정형 FINAL <span>V1.0</span>';\",\n    'I/J shared boost panel'\n  );\n\n  s += `\\nfunction renderDongpaJCard(j,i,params){\\n const byId=id=>document.getElementById(id),s=j?.stats;\\n if(!byId('cmpJFinal'))return;\\n byId('cmpJFinal').textContent=s?'$'+formatNum(s.finalValue,2):'—';\\n byId('cmpJReturn').textContent=s?'누적 수익률 '+signedDongpaComparisonNumber(s.totalReturn)+'%':'—';\\n byId('cmpJSub').textContent=s?'CAGR '+formatNum(s.cagr,2)+'% · MDD '+formatNum(s.mdd,2)+'%':'—';\\n for(const v of 'ABCDEFGHIJ'){const el=byId('cmp'+v+'Final');if(el)el.closest('.rounded-lg').toggleAttribute('data-comparison-selected',v===params.variant[0]);}\\n const deltas=byId('cmpFGDeltas');if(deltas&&i?.stats&&s){const line=document.createElement('div');line.textContent='J−I · 누적 수익률 '+signedDongpaComparisonNumber(s.totalReturn-i.stats.totalReturn)+'%p · CAGR '+signedDongpaComparisonNumber(s.cagr-i.stats.cagr)+'%p · MDD '+signedDongpaComparisonNumber(s.mdd-i.stats.mdd)+'%p';deltas.append(line);}\\n const basis=byId('cmpBasis');if(basis)basis.textContent=basis.textContent.replace('A~I','A~J').replace('A~H','A~J').replace('A~G','A~J');\\n}\\n`;\n  return s;\n};\n\nconst dpJPatchSource=(source)=>{\n  let s=source;\n  s=dpJOne(s,\"<title>동파법 SOXL 백테스터 · A~I · BOOST 안정형 FINAL</title>\",\"<title>동파법 SOXL 백테스터 · A~J · BOOST 안정형 FINAL V1.1</title>\",'J title');\n  s=dpJOne(s,'aria-label=\"F/G/H/I 체결 내역\"','aria-label=\"F/G/H/I/J 체결 내역\"','J trade aria');\n  s=dpJOne(s,'F / G / H / I 체결 내역','F / G / H / I / J 체결 내역','J trade title');\n  s=dpJOne(s,'aria-label=\"F/G/H/I 본계좌 수수료 (%)\"','aria-label=\"F/G/H/I/J 본계좌 수수료 (%)\"','J fee aria');\n  s=dpJOne(s,'<option value=\"I\">I · BOOST 안정형 FINAL</option>','<option value=\"I\">I · BOOST 안정형 FINAL</option>\\n<option value=\"J\">J · BOOST 안정형 FINAL V1.1</option>','J option');\n  s=dpJOne(s,\"H:'H · 6A 공격형 FINAL',I:'I · BOOST 안정형 FINAL'\",\"H:'H · 6A 공격형 FINAL',I:'I · BOOST 안정형 FINAL',J:'J · BOOST 안정형 FINAL V1.1'\",'J label map');\n  s=dpJOne(s,'A / B / C / D / E / F / G / H / I 본계좌 직접 비교','A / B / C / D / E / F / G / H / I / J 본계좌 직접 비교','J compare heading');\n  s=dpJOne(s,'<div class=\"boost-i-heading\">I · BOOST 안정형 FINAL <span>V1.0</span></div>','<div id=\"boostIHeading\" class=\"boost-i-heading\">I · BOOST 안정형 FINAL <span>V1.0</span></div>','dynamic I/J heading');\n  s=dpJOne(s,'@media(min-width:1280px){#r15ComparePanel .dp-seven-grid{grid-template-columns:repeat(9,minmax(0,1fr))}}','@media(min-width:1280px){#r15ComparePanel .dp-seven-grid{grid-template-columns:repeat(10,minmax(0,1fr))}}','10-card grid');\n  s=dpJOne(s,'#r15ComparePanel .dp-i-card{background:#eef2ff;border-color:#818cf8;color:#312e81}','#r15ComparePanel .dp-i-card{background:#eef2ff;border-color:#818cf8;color:#312e81}#r15ComparePanel .dp-j-card{background:#ecfeff;border-color:#06b6d4;color:#155e75}','J card style');\n  const iCard='<div class=\"rounded-lg dp-final-card dp-i-card border p-3\"><div class=\"text-xs font-bold\">I · BOOST 안정형 FINAL</div><div id=\"cmpIFinal\" class=\"text-lg font-extrabold mt-1\">—</div><div id=\"cmpIReturn\" class=\"text-xs font-bold mt-1\">—</div><div id=\"cmpISub\" class=\"text-xs mt-1\">—</div><div class=\"text-xs mt-1\">6A 기본 · 7A BOOST 60일</div></div>';\n  const jCard='<div class=\"rounded-lg dp-final-card dp-j-card border p-3\"><div class=\"text-xs font-bold\">J · BOOST 안정형 FINAL V1.1</div><div id=\"cmpJFinal\" class=\"text-lg font-extrabold mt-1\">—</div><div id=\"cmpJReturn\" class=\"text-xs font-bold mt-1\">—</div><div id=\"cmpJSub\" class=\"text-xs mt-1\">—</div><div class=\"text-xs mt-1\">V1.0 + REF-ORDER GUARD MIN1</div></div>';\n  s=dpJOne(s,iCard,iCard+jCard,'J   const jEscaped=JSON.stringify(jCode).slice(1,-1);
  current=current.replace(programMarker,jEscaped+"const hProgram=dpJPatchProgram(dpIPatchProgram(dpHPatchProgram(fgPayload.program)));");
  current=current.replace(sourceMarker,"text=dpJPatchSource(dpIPatchSource(dpHPatchSource(text)));");
  current=current.replace('ABCDEFGHI-BOOST-STABLE-FINAL-20261110-V1','ABCDEFGHIJ-BOOST-STABLE-FINAL-V1.1-20261111');
  current=current.replace('<title>동파법 백테스터 · F / G / H / I FINAL</title>','<title>동파법 백테스터 · F / G / H / I / J FINAL</title>');
