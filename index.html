try{if(!crypto.subtle)throw new Error('HTTPS 또는 로컬 파일에서 열어주세요.');const key=await crypto.subtle.importKey('raw',dec(raw),'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec('0obENkc4-3pBipIg'),additionalData:new TextEncoder().encode('dongpa-aj-ref-order-v11-20261111-work')},key,dec(document.getElementById('payload').value.trim()));try{localStorage.setItem(STORE,raw);}catch(_){}document.open();document.write(new TextDecoder().decode(plain));document.close();}catch(e){status.textContent='접속 키를 확인해 주세요. 기존 링크의 #k= 뒤 값을 그대로 사용하세요.';form.hidden=false;}}
form.addEventListener('submit',e=>{e.preventDefault();open(document.getElementById('keyInput').value);});let saved='';try{saved=localStorage.getItem(STORE)||'';}catch(_){}open(new URLSearchParams(location.hash.slice(1)).get('k')||saved);
})();
</script></body></html>
