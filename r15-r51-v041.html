  const formatValue=(v)=>{
    if(v==null || v==='') return '-';
    const n=Number(v);
    if(!Number.isFinite(n)) return String(v);
    const abs=Math.abs(n);
    if(abs>=1000) return '$'+n.toLocaleString(undefined,{maximumFractionDigits:2});
    return n.toLocaleString(undefined,{maximumFractionDigits:2});
  };

  const getLastY=(arr)=>{
    if(!Array.isArray(arr)) return null;
    for(let i=arr.length-1;i>=0;i--){
      const p=arr[i];
      if(p==null) continue;
      if(typeof p==='number' && Number.isFinite(p)) return p;
      if(typeof p==='object'){
        if(Number.isFinite(p.y)) return p.y;
        if(Number.isFinite(p.value)) return p.value;
      }
    }
    return null;
  };

  const getChartInstances=()=>{
    if(!window.Chart) return [];
    const inst=window.Chart.instances;
    if(!inst) return [];
    if(Array.isArray(inst)) return inst.filter(Boolean);
    if(typeof inst.values==='function') return [...inst.values()].filter(Boolean);
    return Object.values(inst).filter(Boolean);
  };

  const applyMetricPatch=()=>{
    const metricIds=['resFinalValue','resContributed','resTotalReturn','resCagr','resMdd','resPain','resGpr','resCalmar','resWinRate','resProfitFactor'];
    const metricEls=metricIds.map(id=>document.getElementById(id));
    const metricGrid=metricEls[0]?.parentElement?.parentElement || null;
    if(metricGrid){
      metricGrid.classList.add('dongpa-metric-grid');
      metricEls.forEach((el,i)=>{ if(el?.parentElement) el.parentElement.classList.add('dongpa-metric-card',`dongpa-metric-${i+1}`); });
    }
    const tr=document.getElementById('resTotalReturn');
    if(tr){
      const n=Number(String(tr.textContent||'').replace(/[^0-9+\-.]/g,''));
      if(Number.isFinite(n)) tr.style.setProperty('color',n>=0?'#dc2626':'#2563eb','important');
    }
  };

  const normalizeMoney=(s)=>{
    const m=String(s||'').match(/\$\s*([\d,]+(?:\.\d+)?)/);
    return m ? Number(m[1].replace(/,/g,'')) : null;
  };

  const findMoneyNearLabel=(labels)=>{
    const wanted=(Array.isArray(labels)?labels:[labels]).map(x=>String(x).toLowerCase());
    const els=[...document.querySelectorAll('body *')];
    for(const el of els){
      const own=(el.childElementCount===0 ? el.textContent : '').trim();
      if(!own || own.length>80) continue;
      const low=own.toLowerCase();
      if(!wanted.some(w=>low.includes(w))) continue;
      let node=el;
      for(let i=0;i<4 && node;i++,node=node.parentElement){
        const txt=(node.textContent||'').replace(/\s+/g,' ').trim();
        if(txt.length>400) continue;
        const val=normalizeMoney(txt);
        if(Number.isFinite(val)) return val;
      }
    }
    return null;
  };

  const recursiveFindSoxl=()=>{
    let root=null;
    try{ root=window.dongpaFull?.getResult?.(); }catch(_){ root=null; }
    const seen=new Set();
    const priceKeys=['soxlclose','soxl_close','soxlprice','soxl_price','close','price'];
    const walk=(obj,depth=0)=>{
      if(obj==null || depth>6) return null;
      if(typeof obj!=='object') return null;
      if(seen.has(obj)) return null; seen.add(obj);
      if(Array.isArray(obj)){
        for(let i=obj.length-1;i>=0 && i>=obj.length-30;i--){
          const v=walk(obj[i],depth+1); if(Number.isFinite(v)) return v;
        }
        return null;
      }
      const keys=Object.keys(obj);
      for(const k of keys){
        const lk=k.toLowerCase();
        if(lk.includes('soxl') && /(close|price|종가)/i.test(k) && Number.isFinite(Number(obj[k]))) return Number(obj[k]);
      }
      if(keys.some(k=>/date|날짜/i.test(k))){
        for(const pk of priceKeys){
          const key=keys.find(k=>k.toLowerCase()===pk);
          if(key && Number.isFinite(Number(obj[key]))){
            const dateVal=String(obj[keys.find(k=>/date|날짜/i.test(k))]||'');
            if(dateVal) return Number(obj[key]);
          }
        }
      }
      for(const k of keys){
        if(/history|rows|data|prices|records|series|daily/i.test(k)){
          const v=walk(obj[k],depth+1); if(Number.isFinite(v)) return v;
        }
      }
      return null;
    };
    return walk(root);
  };

  const findSoxlPrice=()=>{
    const charts=getChartInstances();
    for(const chart of charts){
      for(const ds of chart?.data?.datasets||[]){
        if(/soxl/i.test(String(ds.label||''))){
          const v=getLastY(ds.data); if(Number.isFinite(v)) return v;
        }
      }
    }
    const fromResult=recursiveFindSoxl();
    if(Number.isFinite(fromResult)) return fromResult;
    const body=(document.body?.innerText||'').replace(/\s+/g,' ');
    const m=body.match(/SOXL[^$\d]{0,30}\$?\s*([\d]+(?:\.\d+)?)/i);
    return m ? Number(m[1]) : null;
  };

  const applyChartStrip=()=>{
    const charts=getChartInstances();
    const chart=charts.find(c=>c?.data?.datasets?.length) || null;
    if(!chart || !chart.canvas) return;
    const host=chart.canvas.parentElement;
    if(!host) return;
    let strip=host.parentElement?.querySelector(':scope > .dongpa-chart-strip');
    if(!strip){
      strip=document.createElement('div');
      strip.className='dongpa-chart-strip';
      host.insertAdjacentElement('afterend',strip);
    }

    const c0=findMoneyNearLabel(['C0 종료자산','C0 종자산','C0 FINAL','C0']);
    const c2=findMoneyNearLabel(['C2 FINAL 종료자산','C2 FINAL 종자산','C2 FINAL']);
    let delta=findMoneyNearLabel(['C2-C0','C2−C0']);
    if(!Number.isFinite(delta) && Number.isFinite(c0) && Number.isFinite(c2)) delta=c2-c0;
    const soxl=findSoxlPrice();

    const items=[
      {title:'SOXL 최근 종가',value:Number.isFinite(soxl)?'$'+soxl.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'-',color:'#f59e0b'},
      {title:'C0 최종자산',value:Number.isFinite(c0)?'$'+c0.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'-',color:'#475569'},
      {title:'C2 FINAL 최종자산',value:Number.isFinite(c2)?'$'+c2.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'-',color:'#2563eb'},
      {title:'C2 − C0',value:Number.isFinite(delta)?(delta>=0?'+':'-')+'$'+Math.abs(delta).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'-',color:Number.isFinite(delta)&&delta<0?'#dc2626':'#059669'}
    ];
    strip.innerHTML=items.map(x=>`<div class="dongpa-chart-chip"><span class="dongpa-dot" style="background:${x.color}"></span><div><div class="dongpa-chip-title">${x.title}</div><div class="dongpa-chip-value" style="color:${x.color}!important">${x.value}</div></div></div>`).join('');
  };

  const badgeClass=(name)=>{
    const n=String(name||'').trim().toUpperCase();
    if(n==='TURBO') return 'dongpa-badge-turbo';
    if(n==='SCALP') return 'dongpa-badge-scalp';
    if(n==='S0292') return 'dongpa-badge-s0292';
    return '';
  };

  const applyFamilyGuide=()=>{
    const tables=[...document.querySelectorAll('table')];
    const tradeTable=tables.find(t=>/Family/i.test(t.textContent||''));
    if(!tradeTable) return;
    const wrap=tradeTable.closest('div');
    if(wrap && !wrap.querySelector('.dongpa-family-guide')){
      const guide=document.createElement('div');
      guide.className='dongpa-family-guide';
      guide.innerHTML=`
        <div class="dongpa-family-title">Sleeve Family Guide</div>
        <div class="dongpa-family-row"><span class="dongpa-badge dongpa-badge-turbo">TURBO</span><div class="dongpa-family-desc">Internal 실제주문 가능 시 우선 적용되는 Sleeve 계열 · E≥1.25 · 최대 1.00B.</div></div>
        <div class="dongpa-family-row"><span class="dongpa-badge dongpa-badge-scalp">SCALP</span><div class="dongpa-family-desc">SCALP Sleeve 계열 · E≥1.75 · 최대 0.75B · 주문 후 현금 1.75B 이상.</div></div>
        <div class="dongpa-family-row"><span class="dongpa-badge dongpa-badge-s0292">S0292</span><div class="dongpa-family-desc">Standalone 추가매수 S0292 계열 · E≥1.75 · 최대 0.75B · 주문 후 현금 1.75B 이상.</div></div>
      `;
      wrap.insertBefore(guide, tradeTable);
    }
    const ths=[...tradeTable.querySelectorAll('thead th')];
    const familyIdx=ths.findIndex(th=>/Family/i.test(th.textContent||''));
    if(familyIdx<0) return;
    tradeTable.querySelectorAll('tbody tr').forEach(tr=>{
      const tds=tr.children;
      const td=tds[familyIdx];
      if(!td) return;
      const raw=td.textContent.trim();
      const cls=badgeClass(raw);
      if(!cls) return;
      td.innerHTML=`<span class="dongpa-badge ${cls}">${raw}</span>`;
    });
  };

  const runUiPatches=()=>{
    ensureUiPatchStyle();
    applyMetricPatch();
    applyChartStrip();
    applyFamilyGuide();
  };

  const scheduleUiPatches=()=>{
    runUiPatches();
    setTimeout(runUiPatches,200);
    setTimeout(runUiPatches,800);
    setTimeout(runUiPatches,1600);
  };
// ===== END RESULT / CHART / FAMILY UI PATCH =====
  scheduleUiPatches();
  new MutationObserver(()=>scheduleUiPatches()).observe(document.body,{childList:true,subtree:true});

  const ref=document.createElement('meta');ref.name='referrer';ref.content='no-referrer';document.head.append(ref);
  const loadScript=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.referrerPolicy='no-referrer';let done=false;const end=(err)=>{if(done)return;done=true;clearTimeout(t);if(err){s.remove();reject(err);}else resolve();};s.onload=()=>end();s.onerror=()=>end(new Error('화면 라이브러리 연결 실패'));const t=setTimeout(()=>end(new Error('화면 라이브러리 시간초과')),10000);document.head.append(s);});
  const libraryPromise=Promise.allSettled([loadScript('https://cdn.tailwindcss.com'),loadScript('https://cdn.jsdelivr.net/npm/chart.js')]);
  let executionError=null;const capture=e=>{executionError=e.error||new Error(e.message);showFailure(executionError.message);};window.addEventListener('error',capture);
  for(const old of scripts){if(old.src)await loadScript(old.src);else{const s=document.createElement('script');s.textContent=old.textContent;document.body.append(s);s.remove();if(executionError)throw executionError;}}
  if(window.dongpaFull?.recalculate && !window.dongpaFull.__uiPatched){const orig=window.dongpaFull.recalculate.bind(window.dongpaFull);window.dongpaFull.recalculate=(...args)=>{const out=orig(...args);scheduleUiPatches();return out;};window.dongpaFull.__uiPatched=true;}
  scheduleUiPatches();
  libraryPromise.then(()=>{if(window.Chart&&window.dongpaFull?.getResult()){const ce=document.getElementById('fullChartError');if(ce)ce.hidden=true;window.dongpaFull.recalculate();scheduleUiPatches();}});
  window.addEventListener('unhandledrejection',e=>showFailure(e.reason?.message||String(e.reason)));
 }catch(e){showFailure(e.message||String(e));}
})();
