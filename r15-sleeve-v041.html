ld(box);else document.body.prepend(box);\n    return box;\n  }\n  function refreshStatus(){\n    const box=ensureStatus();\n    const ends=dateInputs().filter(isEnd), end=ends[0]?.value||'';\n    const latest=latestDataDate();\n    let badge=end&&end<=SEALED?'SEALED VERIFIED':'EXTENDED LIVE DATA / NOT SEALED';\n    let detail='';\n    if(end&&latest&&end>latest)detail=` · 선택일 <b>${end}</b> · 최신 완료 데이터 <b>${latest}</b> 기준 계산`;\n    else if(latest)detail=` · 최신 데이터 <b>${latest}</b>`;\n    box.innerHTML=`<b>${badge}</b>${detail} · 날짜 변경 시 자동 재계산`;\n  }\n  function init(){bindAllDates();preserveRender();ensureNav();refreshStatus();setTimeout(()=>{bindAllDates();preserveRender();refreshStatus()},350);setTimeout(()=>{bindAllDates();refreshStatus()},1200)}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();\n  try{new MutationObserver(()=>{bindAllDates();refreshStatus()}).observe(document.documentElement,{childList:true,subtree:true})}catch(_e){}\n})();\n<\\/script>";
